name: Build GCam APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Install Apktool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            --output "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/apktool.jar" > "$RUNNER_TEMP/apktool"
          chmod +x "$RUNNER_TEMP/apktool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP:$PATH"
          apktool --version

      - name: Validate decompiled APK project
        run: |
          test -f apktool.yml
          test -f AndroidManifest.xml
          test -d smali
          test -d res
          echo "Found apktool.yml, AndroidManifest.xml, smali and res."

      - name: Ensure startup native library
        run: |
          set -euo pipefail
          bash RUNTHISFIRST.sh
          if [ ! -s lib/arm64-v8a/libgcastartup.so ]; then
            echo "::error::lib/arm64-v8a/libgcastartup.so is missing or empty after RUNTHISFIRST.sh."
            exit 1
          fi

      - name: Validate ARM64 native library ELF files
        run: |
          set -euo pipefail
          shopt -s nullglob
          libraries=(lib/arm64-v8a/*.so)
          if [ ${#libraries[@]} -lt 1 ]; then
            echo "::error::No ARM64 native libraries were found."
            exit 1
          fi
          for library in "${libraries[@]}"; do
            description=$(file -b "$library")
            case "$description" in
              "ELF 64-bit LSB shared object, ARM aarch64"*) ;;
              *)
                echo "::error::Invalid or non-ARM64 native library: $library ($description)"
                exit 1
                ;;
            esac
            header=$(readelf -h "$library")
            printf '%s\\n' "$header" | grep -q 'Class:.*ELF64'
            printf '%s\\n' "$header" | grep -q 'Type:.*DYN'
            printf '%s\\n' "$header" | grep -q 'Machine:.*AArch64'
            mapfile -t load_alignments < <(readelf -lW "$library" | awk '$1 == "LOAD" { print $NF }')
            if [ "${#load_alignments[@]}" -eq 0 ]; then
              echo "::error::No PT_LOAD segments found in $library."
              exit 1
            fi
            for alignment in "${load_alignments[@]}"; do
              value=$((alignment))
              if (( value < 4096 || (value & (value - 1)) != 0 )); then
                echo "::error::Invalid PT_LOAD alignment $alignment in $library."
                exit 1
              fi
              if (( value < 16384 )); then
                echo "::warning::$library uses 4 KB ELF alignment; Android 16 KB page-size compatibility is enabled in the manifest."
              fi
            done
          done
          echo "Validated ${#libraries[@]} ARM64 ELF shared libraries."

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gcam-debug.keystore
          key: gcam-debug-signing-key-v1

      - name: Create debug signing key
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/gcam-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/gcam-debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Using persistent debug signing key."
          fi

      - name: Configure APK signature integrity allowlist
        run: |
          set -euo pipefail
          SIGNER_SHA256="$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/gcam-debug.keystore" \
            -storepass android -alias androiddebugkey \
            | openssl dgst -sha256 -binary | base64 -w0)"
          test -n "$SIGNER_SHA256"
          python3 .github/scripts/set-signature-allowlist.py "$SIGNER_SHA256"
      - name: Rebuild APK with Apktool
        run: |
          mkdir -p build
          apktool b . --output build/gcam-unsigned.apk

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 \
            build/gcam-unsigned.apk build/gcam-aligned.apk

      - name: Sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/gcam-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out build/GCam-8.7.250.44-debug.apk build/gcam-aligned.apk

      - name: Verify APK archive integrity
        run: |
          set -euo pipefail
          unzip -t build/GCam-8.7.250.44-debug.apk >/dev/null
          echo "APK ZIP central directory and CRC checks passed."

      - name: Verify native libraries are stored
        run: |
          set -euo pipefail
          APK=build/GCam-8.7.250.44-debug.apk
          unzip -v "$APK" 'lib/arm64-v8a/*.so' | tee "$RUNNER_TEMP/native-libs-unzip.txt"
          grep -E 'lib/arm64-v8a/[^[:space:]]+\.so$' "$RUNNER_TEMP/native-libs-unzip.txt" > "$RUNNER_TEMP/native-lib-entries.txt"
          expected_count=$(find lib/arm64-v8a -maxdepth 1 -type f -name '*.so' | wc -l)
          actual_count=$(wc -l < "$RUNNER_TEMP/native-lib-entries.txt")
          test "$actual_count" -gt 0
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "::error::Expected $expected_count native libraries in APK; found $actual_count."
            exit 1
          fi
          awk '$2 != "Stored" { print "::error::Native library is not stored: " $NF; bad=1 } END { if (bad) exit 1 }' "$RUNNER_TEMP/native-lib-entries.txt"

      - name: Verify APK alignment
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 build/GCam-8.7.250.44-debug.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/GCam-8.7.250.44-debug.apk

      - name: Inspect APK package metadata
        run: |
          set -euo pipefail
          APK=build/GCam-8.7.250.44-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          BADGING=$("$AAPT2" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'
          printf '%s\n' "$BADGING" | grep -q "^package: name='com.google.android.GoogleCamera'"
          if printf '%s\n' "$BADGING" | grep -q "^uses-feature: name='com.google.android.feature.GOOGLE_EXPERIENCE'"; then
            echo "::error::Pixel-only GOOGLE_EXPERIENCE must not be a required install feature."
            exit 1
          fi
          MANIFEST_TREE=$("$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml)
          printf '%s\n' "$MANIFEST_TREE" > "$RUNNER_TEMP/manifest-tree.txt"
          grep -A 6 'E: uses-sdk' "$RUNNER_TEMP/manifest-tree.txt" || true
          MIN_SDK=$(awk '/E: uses-sdk/ { in_uses_sdk=1; next } in_uses_sdk && /android:minSdkVersion/ { value=$0; sub(/^.*=/, "", value); sub(/[^0-9].*$/, "", value); print value; found=1; in_uses_sdk=0 } END { if (!found) exit 1 }' "$RUNNER_TEMP/manifest-tree.txt")
          if [ "$MIN_SDK" != "33" ]; then
            echo "::error::Expected minSdk 33 in compiled manifest; found '${MIN_SDK:-missing}'."
            exit 1
          fi
          echo "minSdk: $MIN_SDK"
          printf '%s\n' "$BADGING" | grep -q "^targetSdkVersion:'33'$"
          printf '%s\n' "$BADGING" | grep -q "^native-code:.*'arm64-v8a'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCam-8.7.250.44-debug
          path: build/GCam-8.7.250.44-debug.apk
          if-no-files-found: error
          retention-days: 14
